/* ---------- 2) DINE PRODUKTER ----------
   Tilføj/fjern produkter i listen. Hvert produkt har:
     id     : kort unikt navn UDEN mellemrum (bruges i delelinket ?p=...)
     name   : produktets titel
     price  : pris som tekst, fx "899 kr."
     text   : beskrivelse
     badge  : (valgfrit) lille mærkat, fx "Tilbud" eller "Udsolgt" — eller ""

   BILLEDER — vælg én af de to måder:
     images : FLERE billeder i en liste (galleri). Det FØRSTE vises på forsiden,
              resten kan klikkes frem inde på produktet. Eksempel:
                images: ["produkter/bat-1.webp", "produkter/bat-2.webp", "produkter/bat-3.webp"],
     image  : ÉT billede (kortere skrivemåde). Eksempel:
                image: "produkter/bat.webp",
     (Husk: sti + filnavn skal matche filen 100% — også store/små bogstaver.)

   Vil du IKKE bruge produkter endnu? Sæt listen til:  const PRODUCTS = [];     */

<style>
:root{
  --bg:#14161b;          /* mørk som logoet */
  --bg2:#1b1e25;
  --card:#ffffff;
  --ink:#14161b;
  --muted:#6b7280;
  --line:#e7e9ee;
  --green:#1e8449;       /* PurePadel-grøn (fra appen) */
  --green-d:#176b3a;
  --gold:#b7770d;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);
  background:#f4f5f7;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
a{color:inherit}

/* ---------- HERO ---------- */
.hero{
  background:radial-gradient(120% 100% at 50% -20%,#23262f 0%,var(--bg) 60%);
  color:#fff;
  text-align:center;
  padding:54px 20px 64px;
}
.hero .logo{
  width:130px;height:130px;margin:0 auto 18px;
  border-radius:24px;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 40px rgba(0,0,0,.45);
  overflow:hidden;
}
.hero .logo img{width:100%;height:100%;object-fit:contain}
.hero .wordmark{font-size:30px;font-weight:800;letter-spacing:.5px}
.hero h1{font-size:clamp(28px,6vw,46px);font-weight:800;margin:6px 0 2px;letter-spacing:.3px}
.hero .tag{color:#9aa3b2;font-size:17px;margin:0 0 18px}
.hero .intro{max-width:560px;margin:0 auto;color:#c9cfda;font-size:16px}

/* ---------- knapper / socials ---------- */
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:26px}
.btn{
  display:inline-flex;align-items:center;gap:9px;
  padding:12px 20px;border-radius:999px;font-weight:600;font-size:15px;
  text-decoration:none;border:1px solid transparent;transition:.15s;cursor:pointer;
}
.btn svg{width:19px;height:19px;flex:none}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{background:var(--green-d)}
.btn-ghost{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.18)}
.btn-ghost:hover{background:rgba(255,255,255,.16)}

/* ---------- sektioner ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.section{padding:56px 0}
.section h2{font-size:26px;font-weight:800;text-align:center;margin:0 0 6px}
.section .sub{text-align:center;color:var(--muted);margin:0 0 34px}

/* ---------- produkt-grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  display:flex;flex-direction:column;transition:.18s;
}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(20,22,27,.12)}
.card .imgwrap{position:relative;aspect-ratio:4/3;background:#eef0f4}
.card .imgwrap img{width:100%;height:100%;object-fit:cover}
.card .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#aeb4bf;font-size:13px;text-align:center;padding:14px}
.badge{
  position:absolute;top:12px;left:12px;background:var(--gold);color:#fff;
  font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;letter-spacing:.3px;
}
.card .body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{margin:0;font-size:17px;font-weight:700}
.card .price{font-size:18px;font-weight:800;color:var(--green)}
.card .desc{font-size:14px;color:#4b5563;margin:0;flex:1}
.card .actions{display:flex;gap:8px;margin-top:8px}
.card .actions .btn{padding:9px 14px;font-size:13px}
.btn-buy{background:var(--green);color:#fff;flex:1;justify-content:center}
.btn-buy:hover{background:var(--green-d)}
.btn-share{background:#f0f2f5;color:#374151;border-color:var(--line)}
.btn-share:hover{background:#e6e9ee}

.empty{text-align:center;color:var(--muted);padding:30px;border:2px dashed var(--line);border-radius:16px}

/* ---------- enkelt-produkt visning (?p=id) ---------- */
.single{display:flex;gap:34px;flex-wrap:wrap;align-items:flex-start}
.single .imgcol{flex:1 1 320px}
.single .imgcol .imgwrap{aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:#eef0f4;position:relative;border:1px solid var(--line)}
.single .imgcol img{width:100%;height:100%;object-fit:cover}
.single .imgcol img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.thumb{width:66px;height:66px;border-radius:10px;overflow:hidden;border:2px solid var(--line);background:#eef0f4;padding:0;cursor:pointer;flex:none}
.thumb.active{border-color:var(--green)}
.thumb img{width:100%;height:100%;object-fit:cover}
.imgcount{position:absolute;bottom:10px;right:10px;background:rgba(20,22,27,.78);color:#fff;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;pointer-events:none}
.single .info{flex:1 1 320px}
.single .info h2{text-align:left;font-size:28px;margin:0 0 8px}
.single .info .price{font-size:26px;font-weight:800;color:var(--green);margin:0 0 14px}
.single .info .desc{font-size:16px;color:#374151;margin:0 0 24px;white-space:pre-line}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:14px;margin-bottom:22px}
.back:hover{color:var(--ink)}

/* ---------- kontakt ---------- */
.contact{background:#fff;border-top:1px solid var(--line)}
.contact .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;max-width:720px;margin:0 auto}
.cline{display:flex;align-items:center;gap:13px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;text-decoration:none}
.cline:hover{border-color:var(--green);background:#f7fdf9}
.cline .ic{width:42px;height:42px;border-radius:11px;background:#eef6f0;display:flex;align-items:center;justify-content:center;flex:none}
.cline .ic svg{width:21px;height:21px}
.cline .lbl{font-size:12px;color:var(--muted)}
.cline .val{font-weight:600}

/* ---------- footer ---------- */
footer{background:var(--bg);color:#8b93a3;text-align:center;padding:30px 20px;font-size:13px}
footer .social{display:flex;gap:14px;justify-content:center;margin-bottom:14px}
footer .social a{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:#fff}
footer .social a:hover{background:var(--green)}
footer .social svg{width:19px;height:19px}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:#14161b;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;
  opacity:0;pointer-events:none;transition:.25s;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:520px){
  .section{padding:42px 0}
  .hero{padding:40px 18px 50px}
}
</style>
</head>

<script>
/* ---------------- hjælpere ---------------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function attr(s){return esc(s).replace(/"/g,"&quot;");}
function buyHref(p){
  if(CONFIG.email) return "mailto:"+CONFIG.email+"?subject="+encodeURIComponent("Forespørgsel: "+p.name);
  return "#kontakt";
}
function productLink(id){
  return location.origin+location.pathname+"?p="+encodeURIComponent(id);
}
function toast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2200);
}
function copy(text){
  if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>toast("Link kopieret ✓"),()=>toast(text));}
  else{toast(text);}
}
function shareProduct(id){
  var p=PRODUCTS.find(x=>x.id===id); if(!p)return;
  var url=productLink(id);
  if(navigator.share){navigator.share({title:p.name,url:url}).catch(()=>{});}
  else{copy(url);}
}
window.shareProduct=shareProduct;

/* ---------------- byggeklodser ---------------- */
/* Returnerer altid en liste af billeder (understøtter både images:[...] og image:"...") */
function productImages(p){
  if(Array.isArray(p.images)) return p.images.filter(Boolean);
  if(p.image) return [p.image];
  return [];
}
function imgOrPlaceholder(src, alt){
  if(src){
    return '<img src="'+attr(src)+'" alt="'+attr(alt||"")+'" loading="lazy" '
      + 'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'
      + '<div class="ph" style="display:none">Billede mangler<br>('+attr(src)+')</div>';
  }
  return '<div class="ph" style="display:flex">Tilføj et billede</div>';
}
/* Skift hovedbillede inde i galleriet */
function swapImg(btn, src){
  var main=document.getElementById("mainimg");
  if(main){ main.style.display="block"; main.src=src; }
  var thumbs=btn.parentNode.querySelectorAll(".thumb");
  for(var i=0;i<thumbs.length;i++) thumbs[i].classList.remove("active");
  btn.classList.add("active");
}
window.swapImg=swapImg;

function heroHTML(){
  var s="";
  s+='<div class="hero" id="top">';
  s+=  '<div class="logo"><img src="logo.png" alt="'+attr(CONFIG.brand)+'" '
     + 'onerror="this.parentNode.style.display=\'none\'"></div>';
  s+=  '<h1>'+esc(CONFIG.brand)+'</h1>';
  if(CONFIG.tagline) s+='<p class="tag">'+esc(CONFIG.tagline)+'</p>';
  if(CONFIG.intro)   s+='<p class="intro">'+esc(CONFIG.intro)+'</p>';
  s+=  '<div class="btns">';
  s+=    '<a class="btn btn-green" href="#produkter">Se produkter</a>';
  if(CONFIG.facebook)  s+='<a class="btn btn-ghost" href="'+attr(CONFIG.facebook)+'" target="_blank" rel="noopener"><svg><use href="#i-fb"/></svg>Facebook</a>';
  if(CONFIG.instagram) s+='<a class="btn btn-ghost" href="'+attr(CONFIG.instagram)+'" target="_blank" rel="noopener"><svg><use href="#i-ig"/></svg>Instagram</a>';
  s+=  '</div>';
  s+='</div>';
  return s;
}

function cardHTML(p){
  var imgs=productImages(p);
  var s="";
  s+='<div class="card">';
  s+=  '<a class="imgwrap" href="?p='+encodeURIComponent(p.id)+'" style="text-decoration:none">';
  if(p.badge) s+='<span class="badge">'+esc(p.badge)+'</span>';
  s+=    imgOrPlaceholder(imgs[0], p.name);
  if(imgs.length>1) s+='<span class="imgcount">📷 '+imgs.length+'</span>';
  s+=  '</a>';
  s+=  '<div class="body">';
  s+=    '<h3>'+esc(p.name)+'</h3>';
  if(p.price) s+='<div class="price">'+esc(p.price)+'</div>';
  s+=    '<p class="desc">'+esc(p.text)+'</p>';
  s+=    '<div class="actions">';
  s+=      '<a class="btn btn-buy" href="'+attr(buyHref(p))+'">Kontakt for køb</a>';
  s+=      '<button class="btn btn-share" onclick="shareProduct(\''+attr(p.id)+'\')" title="Del produkt"><svg><use href="#i-share"/></svg></button>';
  s+=    '</div>';
  s+=  '</div>';
  s+='</div>';
  return s;
}

function productsHTML(){
  var s='<div class="section" id="produkter"><div class="wrap">';
  s+='<h2>Vores produkter</h2>';
  s+='<p class="sub">Kontakt os for køb, pris og tilgængelighed.</p>';
  if(!PRODUCTS.length){
    s+='<div class="empty">Der er ikke lagt produkter op endnu.</div>';
  }else{
    s+='<div class="grid">'+PRODUCTS.map(cardHTML).join("")+'</div>';
  }
  s+='</div></div>';
  return s;
}

function singleHTML(p){
  var s='<div class="hero" id="top" style="padding-bottom:34px">';
  s+=  '<a href="?" style="text-decoration:none"><div class="logo"><img src="logo.png" alt="'+attr(CONFIG.brand)+'" '
     + 'onerror="this.parentNode.parentNode.outerHTML=\'<a href=&quot;?&quot; style=&quot;color:#fff;text-decoration:none&quot;><span class=\\\'wordmark\\\'>'+attr(CONFIG.brand)+'</span></a>\'"></div></a>';
  s+='</div>';
  s+='<div class="section"><div class="wrap">';
  s+='<a class="back" href="?">&larr; Alle produkter</a>';
  var imgs=productImages(p);
  s+='<div class="single">';
  s+=  '<div class="imgcol">';
  s+=    '<div class="imgwrap">';
  if(p.badge) s+='<span class="badge">'+esc(p.badge)+'</span>';
  if(imgs.length){
    s+='<img id="mainimg" src="'+attr(imgs[0])+'" alt="'+attr(p.name)+'" '
      + 'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'
      + '<div class="ph" style="display:none">Billede mangler<br>('+attr(imgs[0])+')</div>';
  }else{
    s+='<div class="ph" style="display:flex">Tilføj et billede</div>';
  }
  s+=    '</div>';
  if(imgs.length>1){
    s+='<div class="thumbs">';
    for(var i=0;i<imgs.length;i++){
      s+='<button class="thumb'+(i===0?' active':'')+'" onclick="swapImg(this,\''+attr(imgs[i])+'\')">'
        + '<img src="'+attr(imgs[i])+'" alt="" onerror="this.parentNode.style.display=\'none\'"></button>';
    }
    s+='</div>';
  }
  s+=  '</div>';
  s+=  '<div class="info">';
  s+=    '<h2>'+esc(p.name)+'</h2>';
  if(p.price) s+='<div class="price">'+esc(p.price)+'</div>';
  s+=    '<p class="desc">'+esc(p.text)+'</p>';
  s+=    '<div class="btns" style="justify-content:flex-start">';
  s+=      '<a class="btn btn-green" href="'+attr(buyHref(p))+'"><svg><use href="#i-mail"/></svg>Kontakt for køb</a>';
  s+=      '<button class="btn btn-share" style="border:1px solid var(--line)" onclick="shareProduct(\''+attr(p.id)+'\')"><svg><use href="#i-share"/></svg>Del</button>';
  s+=    '</div>';
  s+=  '</div>';
  s+='</div>';
  s+='</div></div>';
  return s;
}

function contactHTML(){
  var rows="";
  if(CONFIG.email) rows+='<a class="cline" href="mailto:'+attr(CONFIG.email)+'"><span class="ic"><svg><use href="#i-mail"/></svg></span><span><span class="lbl">Email</span><br><span class="val">'+esc(CONFIG.email)+'</span></span></a>';
  if(CONFIG.phone) rows+='<a class="cline" href="tel:'+attr(CONFIG.phone.replace(/\s/g,""))+'"><span class="ic"><svg><use href="#i-phone"/></svg></span><span><span class="lbl">Telefon</span><br><span class="val">'+esc(CONFIG.phone)+'</span></span></a>';
  if(CONFIG.facebook) rows+='<a class="cline" href="'+attr(CONFIG.facebook)+'" target="_blank" rel="noopener"><span class="ic"><svg><use href="#i-fb"/></svg></span><span><span class="lbl">Følg os</span><br><span class="val">Facebook</span></span></a>';
  if(CONFIG.instagram) rows+='<a class="cline" href="'+attr(CONFIG.instagram)+'" target="_blank" rel="noopener"><span class="ic"><svg><use href="#i-ig"/></svg></span><span><span class="lbl">Følg os</span><br><span class="val">Instagram</span></span></a>';
  if(!rows) return "";
  var s='<div class="section contact" id="kontakt"><div class="wrap">';
  s+='<h2>Kontakt</h2><p class="sub">Skriv eller ring — vi svarer hurtigst muligt.</p>';
  s+='<div class="cards">'+rows+'</div>';
  s+='</div></div>';
  return s;
}

function footerHTML(){
  var soc="";
  if(CONFIG.facebook)  soc+='<a href="'+attr(CONFIG.facebook)+'" target="_blank" rel="noopener" aria-label="Facebook"><svg><use href="#i-fb"/></svg></a>';
  if(CONFIG.instagram) soc+='<a href="'+attr(CONFIG.instagram)+'" target="_blank" rel="noopener" aria-label="Instagram"><svg><use href="#i-ig"/></svg></a>';
  var year=document.lastModified ? new Date(document.lastModified).getFullYear() : "";
  var s='<footer>';
  if(soc) s+='<div class="social">'+soc+'</div>';
  s+='<div>&copy; '+(year||"")+' '+esc(CONFIG.brand)+'</div>';
  s+='</footer>';
  return s;
}

/* ---------------- render ---------------- */
function render(){
  var params=new URLSearchParams(location.search);
  var pid=params.get("p");
  var app=document.getElementById("app");
  if(pid){
    var p=PRODUCTS.find(x=>x.id===pid);
    if(p){
      document.title=p.name+" — "+CONFIG.brand;
      app.innerHTML=singleHTML(p)+contactHTML()+footerHTML();
      window.scrollTo(0,0);
      return;
    }
  }
  app.innerHTML=heroHTML()+productsHTML()+contactHTML()+footerHTML();
}
render();
window.addEventListener("popstate",render);
</script>
</body>
</html>
